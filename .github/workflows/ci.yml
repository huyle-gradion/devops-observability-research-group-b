name: ci

# Trigger boundaries: only the personal/huy integration branch publishes. Pull
# requests target that same branch, run the lint..smoke gates, and can never
# publish. There is deliberately no pull_request_target and no trigger on env/huy.
on:
  push:
    branches:
      - personal/huy
    paths:
      - 'app/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
      - '.dockerignore'
  pull_request:
    branches:
      - personal/huy
    paths:
      - 'app/**'
      - 'web/**'
      - '.github/workflows/ci.yml'
      - '.dockerignore'

# Deny the built-in GITHUB_TOKEN everywhere by default. Jobs grant only the
# minimal scope they need, and the project PAT is passed explicitly instead of
# relying on any implicit token. PR jobs receive no project secret at all.
permissions: {}

env:
  IMAGE_NAME: ghcr.io/huyle-gradion/devops-app-huy

# Six jobs, one ordered needs-chain, preserving the team's eight-step pipeline
# language (see captures/huy/step-1/ci/ci-6jobs.md for the step -> job mapping):
#   lint -> compile -> test -> build -> smoke -> publish
# lint/compile/test prove the source; build proves the image builds and emits
# SBOM/provenance evidence; smoke runs and scans the image locally with no
# secret; publish is the only job that sees PROJECT_GITHUB_TOKEN.
jobs:
  # --- step 1: lint -----------------------------------------------------------
  # gofmt + go vet on the module. No secret: the public change is fetched with
  # plain anonymous Git and setup-go's default token is explicitly disabled.
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the change anonymously
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          # Empty disables the action's default github.token authentication.
          token: ''
          cache-dependency-path: app/go.mod

      - name: gofmt check
        working-directory: app
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "gofmt would rewrite these files:" >&2
            echo "${unformatted}" >&2
            exit 1
          fi

      - name: go vet
        working-directory: app
        run: go vet ./...

  # --- step 2: compile --------------------------------------------------------
  # Prove the binary compiles before the behavior tests run.
  compile:
    name: compile
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the change anonymously
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          token: ''
          cache-dependency-path: app/go.mod

      - name: Compile the binary
        working-directory: app
        run: CGO_ENABLED=0 go build -o /tmp/ci-compile-app .

  # --- step 3: test -----------------------------------------------------------
  # go test locks the exact /health and /test bytes and headers (app/main_test.go).
  test:
    name: test
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out the change anonymously
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          token: ''
          cache-dependency-path: app/go.mod

      - name: Test
        working-directory: app
        run: go test ./...

  # --- step 4: build ----------------------------------------------------------
  # Build the image with no login and no push, and emit SBOM + max provenance
  # attestations through the OCI exporter. The docker exporter (--load) cannot
  # carry attestations on a default runner, so the build uses an OCI archive
  # output instead of loading into the local daemon; the smoke job builds its own
  # runnable copy. The base image digests baked into app/Dockerfile are recorded.
  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the change anonymously
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout FETCH_HEAD

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image with no login and no push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=/tmp/ci-image.tar
          sbom: true
          provenance: mode=max
          # Empty explicitly overrides the action's default github.token.
          github-token: ''

      - name: Record base image digests from app/Dockerfile
        run: |
          set -euo pipefail
          echo "Base images pinned in app/Dockerfile:"
          grep -E '^FROM ' app/Dockerfile | sed -E 's/^/  /'
          if grep -E '^FROM ' app/Dockerfile | grep -vqE '@sha256:[0-9a-f]{64}'; then
            echo "ERROR: a base image is not pinned by full digest" >&2
            exit 1
          fi

  # --- step 5: local smoke + scan --------------------------------------------
  # Build the image locally (no login, no push) and prove it actually serves the
  # contract on loopback, then report a Trivy scan. No secret reaches this job.
  smoke:
    name: smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the change anonymously
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git checkout FETCH_HEAD

      - name: Build the image locally (no login, no push)
        run: docker build -f app/Dockerfile -t devops-app-huy:ci-local .

      - name: Install pinned Trivy (report only)
        run: |
          set -euo pipefail
          TRIVY_VERSION=0.75.0
          TARBALL="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSL -o "/tmp/${TARBALL}" "${base}/${TARBALL}"
          curl -fsSL -o /tmp/trivy_checksums.txt "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          ( cd /tmp && grep " ${TARBALL}$" trivy_checksums.txt | sha256sum -c - )
          tar -xzf "/tmp/${TARBALL}" -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy

      - name: Run and smoke-test the local image
        run: |
          set -euo pipefail
          IMAGE="devops-app-huy:ci-local"
          CID="$(docker run -d --name ci-local-smoke \
            -p 127.0.0.1:18080:8080 -e APP_ENV=ci-local "${IMAGE}")"

          cleanup() {
            docker stop ci-local-smoke >/dev/null 2>&1 || true
            docker rm -f ci-local-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Bounded startup poll: fail if /health never answers within 30s.
          deadline=$((SECONDS + 30))
          until curl -fsS -o /dev/null "http://127.0.0.1:18080/health"; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "startup timeout: /health not ready within 30s" >&2
              docker logs "${CID}" >&2 || true
              exit 1
            fi
            sleep 1
          done

          HOSTNAME="$(docker inspect "${CID}" --format '{{.Config.Hostname}}')"

          health_code="$(curl -sS -o /tmp/health.body -w '%{http_code}' http://127.0.0.1:18080/health)"
          [ "${health_code}" = "200" ] || { echo "health status ${health_code}, want 200" >&2; exit 1; }
          [ "$(cat /tmp/health.body)" = "ok" ] || { echo "health body '$(cat /tmp/health.body)', want 'ok'" >&2; exit 1; }

          test_code="$(curl -sS -D /tmp/test.headers -o /tmp/test.body -w '%{http_code}' http://127.0.0.1:18080/test)"
          [ "${test_code}" = "200" ] || { echo "test status ${test_code}, want 200" >&2; exit 1; }
          expected="Hello world from container-${HOSTNAME}"
          [ "$(cat /tmp/test.body)" = "${expected}" ] || { echo "test body '$(cat /tmp/test.body)', want '${expected}'" >&2; exit 1; }
          grep -qi '^X-App-Env: ci-local' /tmp/test.headers || { echo "missing or wrong X-App-Env header" >&2; cat /tmp/test.headers >&2; exit 1; }

          echo "smoke ok: hostname ${HOSTNAME}, env ci-local"

      - name: Trivy scan (report only)
        run: |
          set -euo pipefail
          # Report only: never fail the job on findings. Record scanner + DB date.
          trivy image --exit-code 0 --no-progress --severity HIGH,CRITICAL devops-app-huy:ci-local || true
          echo "--- scanner and vulnerability DB ---"
          trivy --version

  # --- step 6: publish + attest + digest smoke --------------------------------
  # Trusted source-push only. Requires the whole lint..smoke chain green and a
  # push to personal/huy; a pull_request event never reaches this job. This is the
  # only job that receives PROJECT_GITHUB_TOKEN, and the only one granted OIDC.
  publish:
    name: publish
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/personal/huy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing identity for attestation only. This grants the workflow's
      # short-lived OIDC token; it does not grant or widen any PAT scope.
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the trusted source anonymously
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout FETCH_HEAD

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: huyle-gradion
          password: ${{ secrets.PROJECT_GITHUB_TOKEN }}

      - name: Build and push the multi-platform image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/huyle-gradion/devops-observability-research-group-b
            org.opencontainers.image.revision=${{ github.sha }}
          sbom: true
          provenance: mode=max
          # Explicit project token; never the action's default github.token.
          github-token: ${{ secrets.PROJECT_GITHUB_TOKEN }}

      # Signed SLSA build provenance for the pushed digest, produced after the
      # multi-platform push and before the job exposes its digest. The signature
      # comes from the workflow's OIDC identity (id-token: write); the project PAT
      # below only authorizes the API/registry calls.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
          github-token: ${{ secrets.PROJECT_GITHUB_TOKEN }}

      # Digest proof: pull the exact published index digest and repeat the same
      # health/test/header asserts the local smoke job performs.
      - name: Pull the published digest and smoke-test it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${IMAGE_NAME}@${DIGEST}"
          docker pull "${IMAGE}"
          CID="$(docker run -d --name ci-digest-smoke \
            -p 127.0.0.1:18080:8080 -e APP_ENV=ci-proof "${IMAGE}")"

          cleanup() {
            docker stop ci-digest-smoke >/dev/null 2>&1 || true
            docker rm -f ci-digest-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          deadline=$((SECONDS + 30))
          until curl -fsS -o /dev/null "http://127.0.0.1:18080/health"; do
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "startup timeout: /health not ready within 30s" >&2
              docker logs "${CID}" >&2 || true
              exit 1
            fi
            sleep 1
          done

          HOSTNAME="$(docker inspect "${CID}" --format '{{.Config.Hostname}}')"

          health_code="$(curl -sS -o /tmp/health.body -w '%{http_code}' http://127.0.0.1:18080/health)"
          [ "${health_code}" = "200" ] || { echo "health status ${health_code}, want 200" >&2; exit 1; }
          [ "$(cat /tmp/health.body)" = "ok" ] || { echo "health body '$(cat /tmp/health.body)', want 'ok'" >&2; exit 1; }

          test_code="$(curl -sS -D /tmp/test.headers -o /tmp/test.body -w '%{http_code}' http://127.0.0.1:18080/test)"
          [ "${test_code}" = "200" ] || { echo "test status ${test_code}, want 200" >&2; exit 1; }
          expected="Hello world from container-${HOSTNAME}"
          [ "$(cat /tmp/test.body)" = "${expected}" ] || { echo "test body '$(cat /tmp/test.body)', want '${expected}'" >&2; exit 1; }
          grep -qi '^X-App-Env: ci-proof' /tmp/test.headers || { echo "missing or wrong X-App-Env header" >&2; cat /tmp/test.headers >&2; exit 1; }

          echo "digest smoke ok: hostname ${HOSTNAME}, digest ${DIGEST}"

  # --- step 7: propose reviewed digest PR against env/huy ---------------------
  # Trusted source-push only, and only when the whole lint..publish chain is
  # green: `needs: publish` plus the same push/ref guard means a pull_request
  # event never reaches this job, and a failed or skipped `publish` skips this
  # job automatically (a job that needs a failed or skipped job is skipped too).
  # This is the second and last job that sees PROJECT_GITHUB_TOKEN. It holds NO
  # cluster credential -- no kubeconfig, no SSH key, no service-account token --
  # and it never auto-merges; a human merges the reviewed PR.
  #
  # Event/filter boundary (deliberate): only a push or PR that targets
  # personal/huy enters this workflow at all. env/huy and deploy/* are NOT in
  # `on:`, so a push to them cannot trigger this workflow, and the paths filter
  # (app/**, web/**, ci.yml, .dockerignore) excludes k8s/**. A PAT-created PR
  # CAN trigger other workflows, so those explicit branch+path filters -- not the
  # branch names -- are the real guard. Do not add env/huy or deploy/* to any
  # trigger, and do not add an `env/huy` source-build recursion.
  propose-deploy:
    name: propose-deploy
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/personal/huy'
    runs-on: ubuntu-latest
    env:
      DEPLOY_BRANCH: deploy/huy-${{ github.sha }}
    steps:
      - name: Validate publish digest, source SHA and identity
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${DIGEST}" ]; then
            echo "ERROR: publish digest is empty; refusing to propose anything" >&2
            exit 1
          fi
          case "${DIGEST}" in
            sha256:*) ;;
            *) echo "ERROR: digest '${DIGEST}' is not a sha256:... reference" >&2; exit 1 ;;
          esac
          if [ -z "${SOURCE_SHA}" ]; then
            echo "ERROR: source SHA is empty" >&2
            exit 1
          fi
          if [ "${REPO_SLUG}" != "huyle-gradion/devops-observability-research-group-b" ]; then
            echo "ERROR: unexpected repository '${REPO_SLUG}'" >&2
            exit 1
          fi
          if [ "${IMAGE_NAME}" != "ghcr.io/huyle-gradion/devops-app-huy" ]; then
            echo "ERROR: unexpected image identity '${IMAGE_NAME}'" >&2
            exit 1
          fi
          echo "inputs ok: repo=${REPO_SLUG} sha=${SOURCE_SHA} digest=${DIGEST}"

      - name: Install pinned kubectl (local manifest editing only)
        run: |
          set -euo pipefail
          KUBECTL_VERSION=v1.37.1
          base="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64"
          curl -fsSL -o /tmp/kubectl "${base}/kubectl"
          curl -fsSL -o /tmp/kubectl.sha256 "${base}/kubectl.sha256"
          ( cd /tmp && echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c - )
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client=true

      - name: Prepare env/huy deploy branch and stage the one image change
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.PROJECT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PROJECT_GITHUB_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          WANT_IMAGE="${IMAGE_NAME}@${DIGEST}"

          # Process-scoped Git HTTPS credential: a repo-scoped Authorization
          # header supplied through git's own environment config. It never lands
          # in argv, in a remote URL, or in any file on disk, and it dies with
          # this shell. GIT_CONFIG_* is cleared by the runner between steps.
          AUTH="AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="${AUTH}"

          WORK="${RUNNER_TEMP:-/tmp}/env-propose"
          rm -rf "${WORK}"
          mkdir -p "${WORK}"
          cd "${WORK}"

          git init --quiet .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --quiet origin \
            "refs/heads/env/huy:refs/remotes/origin/env/huy"

          branch_exists=false
          if git ls-remote --heads origin "refs/heads/${DEPLOY_BRANCH}" | grep -q .; then
            branch_exists=true
          fi

          if [ "${branch_exists}" = true ]; then
            git fetch --no-tags --quiet origin \
              "refs/heads/${DEPLOY_BRANCH}:refs/remotes/origin/${DEPLOY_BRANCH}"
            # Fast-forwardable only: env/huy's tip must be an ancestor of the
            # existing deploy branch. If env/huy moved on, or the branch
            # diverged, do NOT reset / rebase / merge / force-push -- stop so a
            # human can review the two tips.
            if ! git merge-base --is-ancestor \
                 refs/remotes/origin/env/huy "refs/remotes/origin/${DEPLOY_BRANCH}"; then
              echo "ERROR: ${DEPLOY_BRANCH} is not fast-forwardable from env/huy" >&2
              echo "  env/huy          $(git rev-parse refs/remotes/origin/env/huy)" >&2
              echo "  ${DEPLOY_BRANCH} $(git rev-parse refs/remotes/origin/${DEPLOY_BRANCH})" >&2
              echo "STOP: refusing to reset, force-push or silently resolve; needs human review" >&2
              exit 1
            fi
            git checkout --quiet -B "${DEPLOY_BRANCH}" "refs/remotes/origin/${DEPLOY_BRANCH}"
          else
            git checkout --quiet -B "${DEPLOY_BRANCH}" refs/remotes/origin/env/huy
          fi

          current_image="$(
            python3 -c 'import yaml; d=yaml.safe_load(open("k8s/app/deployment.yaml")); print([c for c in d["spec"]["template"]["spec"]["containers"] if c["name"] == "app"][0]["image"])'
          )"
          echo "current image on ${DEPLOY_BRANCH}: ${current_image}"

          if [ "${current_image}" = "${WANT_IMAGE}" ]; then
            echo "desired digest already present; no commit and no manifest change"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            if [ "${branch_exists}" = true ]; then
              echo "propose=true" >> "${GITHUB_OUTPUT}"
            else
              echo "propose=false" >> "${GITHUB_OUTPUT}"
            fi
            exit 0
          fi

          # kubectl is the authority for the target image string, but its YAML
          # output re-serialises the document (reorders fields, drops comments,
          # adds strategy/status). So take only the computed image scalar from
          # it and splice exactly that one value into the tracked file; every
          # other byte, including comments, is preserved. This is a scoped,
          # reviewed replacement of the one manifest -- never a regex across
          # manifests.
          kubectl set image --local -f k8s/app/deployment.yaml \
            "app=${WANT_IMAGE}" -o yaml > /tmp/deployment.kubectl.yaml

          python3 - "${WANT_IMAGE}" <<'PY'
          import copy
          import sys
          import yaml

          want = sys.argv[1]
          path = "k8s/app/deployment.yaml"

          with open(path) as fh:
              original_text = fh.read()
          original = yaml.safe_load(original_text)
          with open("/tmp/deployment.kubectl.yaml") as fh:
              kubectl_doc = yaml.safe_load(fh)

          def app_container(doc):
              containers = doc["spec"]["template"]["spec"]["containers"]
              matches = [c for c in containers if c["name"] == "app"]
              if len(matches) != 1:
                  raise SystemExit("expected exactly one container named 'app'")
              return matches[0]

          if app_container(kubectl_doc)["image"] != want:
              raise SystemExit("kubectl produced an unexpected image")

          old_image = app_container(original)["image"]
          lines = original_text.splitlines(keepends=True)
          hits = [i for i, line in enumerate(lines) if old_image in line]
          if len(hits) != 1:
              raise SystemExit("expected exactly one line carrying the old image, found %d" % len(hits))
          lines[hits[0]] = lines[hits[0]].replace(old_image, want)
          new_text = "".join(lines)

          checked = yaml.safe_load(new_text)
          if app_container(checked)["image"] != want:
              raise SystemExit("spliced image is wrong")

          before = copy.deepcopy(original)
          after = copy.deepcopy(checked)
          popped_before = app_container(before).pop("image")
          popped_after = app_container(after).pop("image")
          if before != after or popped_before != old_image or popped_after != want:
              raise SystemExit("splice changed more than the app container image")

          with open(path, "w") as fh:
              fh.write(new_text)
          print("staged image change: %s -> %s" % (old_image, want))
          PY

          git add k8s/app/deployment.yaml
          changed_files="$(git diff --cached --name-only)"
          if [ "${changed_files}" != "k8s/app/deployment.yaml" ]; then
            echo "ERROR: unexpected changed files:" >&2
            echo "${changed_files}" >&2
            exit 1
          fi
          added="$(git diff --cached --numstat -- k8s/app/deployment.yaml | cut -f1)"
          removed="$(git diff --cached --numstat -- k8s/app/deployment.yaml | cut -f2)"
          if [ "${added}" != "1" ] || [ "${removed}" != "1" ]; then
            echo "ERROR: expected a single-line image change, got +${added}/-${removed}" >&2
            git diff --cached -- k8s/app/deployment.yaml >&2
            exit 1
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet \
              -m "deploy: pin devops-app image to ${DIGEST}" \
              -m "Proposed by CI run ${RUN_URL} from source ${SOURCE_SHA}. Changes only the app container image in k8s/app/deployment.yaml; promoted to desired state by a reviewed PR merge into env/huy."

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          echo "propose=true" >> "${GITHUB_OUTPUT}"

      - name: Push the scoped deploy branch (fast-forward only)
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PROJECT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_TOKEN}" | base64 | tr -d '\n')"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="${AUTH}"
          cd "${RUNNER_TEMP:-/tmp}/env-propose"
          # Plain push, never --force: a non-fast-forward remote is rejected and
          # fails the job for human review instead of overwriting anything.
          git push origin "HEAD:refs/heads/${DEPLOY_BRANCH}"

      - name: Open or reuse exactly one digest PR against env/huy
        if: steps.prepare.outputs.propose == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.PROJECT_GITHUB_TOKEN }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"

          existing="$(gh pr list --repo "${REPO}" --head "${DEPLOY_BRANCH}" \
            --base env/huy --state open --json number --jq '.[].number')"
          if [ -n "${existing}" ]; then
            echo "reusing existing open PR #${existing} for ${DEPLOY_BRANCH}; no duplicate"
            exit 0
          fi

          if ! git ls-remote --heads "https://github.com/${REPO}.git" \
               "refs/heads/${DEPLOY_BRANCH}" | grep -q .; then
            echo "remote branch ${DEPLOY_BRANCH} does not exist; nothing to propose"
            exit 0
          fi

          {
            echo "## Reviewed desired-state digest update"
            echo
            echo "- Source commit: \`${SOURCE_SHA}\`"
            echo "- Green trusted CI run: ${RUN_URL}"
            echo "- Published image: \`${IMAGE_NAME}@${DIGEST}\`"
            echo "- Changed file: \`k8s/app/deployment.yaml\` (app container image only)"
            echo
            echo "### Verification / attestation linkage"
            echo
            echo "The image was built, pushed and digest-smoke-tested by the \`publish\` job,"
            echo "and signed SLSA build provenance was attested there with"
            echo "\`actions/attest-build-provenance\` (keyless OIDC, registry push) under the"
            echo "same run linked above. Verify locally with:"
            echo
            echo '```'
            echo "gh attestation verify oci://${IMAGE_NAME}@${DIGEST} --repo ${REPO}"
            echo '```'
            echo
            echo "### Approval boundary"
            echo
            echo "CI opened this PR but never auto-merges and never writes \`env/huy\`"
            echo "directly. A human reviews this exact diff and merges it; that reviewed"
            echo "merge is the approval boundary that promotes the artifact to desired"
            echo "state. CI publication alone is not CD."
          } > /tmp/pr-body.md

          gh pr create --repo "${REPO}" --base env/huy --head "${DEPLOY_BRANCH}" \
            --title "deploy: propose devops-app image for ${SOURCE_SHA:0:12}" \
            --body-file /tmp/pr-body.md

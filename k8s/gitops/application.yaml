apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-app-huy
  namespace: argocd
spec:
  project: huy
  source:
    repoURL: https://github.com/huyle-gradion/devops-observability-research-group-b.git
    targetRevision: env/huy
    path: k8s/app
  destination:
    server: https://kubernetes.default.svc
    namespace: devops-app
  # Stage 08D: automated sync. selfHeal corrects cluster drift; prune removes
  # resources no longer in Git; allowEmpty:false refuses a blank desired state
  # (so a bad revision cannot wipe the app). Manual sync in 08C proved the loop;
  # this is the automatic mode. The bootstrap Namespace stays source-managed.
  syncPolicy:
    automated:
      enabled: true
      selfHeal: true
      prune: true
      allowEmpty: false

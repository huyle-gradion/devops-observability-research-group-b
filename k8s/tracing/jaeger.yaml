# Jaeger all-in-one (v2) viewer for the Stage 10 tracing path.
#
# Runs the image's *embedded* all-in-one configuration: OTLP/HTTP receiver on
# 0.0.0.0:4318 and the Jaeger UI on 16686, backed by **transient in-memory**
# trace storage. There is deliberately no persistent volume and no
# durable-storage backend: a pod restart loses every trace. That limitation is
# stated here, not hidden.
#
# Cross-pod reachability: the image bakes `ENV JAEGER_LISTEN_HOST=0.0.0.0` and
# its embedded config binds each receiver to
# `${env:JAEGER_LISTEN_HOST:-localhost}:<port>` (Jaeger v2.22.0
# cmd/jaeger/internal/all-in-one.yaml). We set the variable explicitly so the
# OTLP receiver listens on the pod network rather than silently depending on an
# image default — a loopback bind would make the Collector's
# `otlp_http/jaeger` export to http://jaeger.monitoring.svc.cluster.local:4318
# fail with connection refused.
#
# The UI stays private: a ClusterIP Service and a `kubectl port-forward` only.
# No Ingress and no public tunnel.
#
# Image is pinned by BOTH tag and digest. The digest is what the kubelet pulls.
#
# NOTE ON PORT NAMES: the Jaeger viewer port is exposed under the Service port
# name `jaeger16686`, not the bare number `16686`. Kubernetes rejects an
# all-numeric Service port name: `IsValidPortName` requires at least one [a-z]
# letter. The port *number* is still 16686 as required.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.22.0@sha256:836b967b5abcf1f7758066aa6b348619267a2f1459f72d472840570f9bd88a17
          env:
            # Belt-and-braces with the image's baked ENV: bind receivers to the
            # pod network so the sibling Collector pod can reach OTLP/HTTP.
            - name: JAEGER_LISTEN_HOST
              value: "0.0.0.0"
          ports:
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: ui
              containerPort: 16686
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: monitoring
  labels:
    app: jaeger
spec:
  type: ClusterIP
  selector:
    app: jaeger
  ports:
    - name: jaeger4318
      port: 4318
      targetPort: otlp-http
      protocol: TCP
    - name: jaeger16686
      port: 16686
      targetPort: ui
      protocol: TCP
